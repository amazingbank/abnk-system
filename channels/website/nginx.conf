# ABNK Website — 容器内 nginx 配置
#
# - :80 全量 301 跳转 https（$host 保留原域名）
# - :443 TLS 终止（证书只读挂载 /etc/nginx/ssl——部署根数据域，续期只需 restart）
# - 静态托管 + SPA fallback（try_files → /index.html）
# - TLS 安全基线：TLS1.2/1.3 + 主流套件 + HSTS + OCSP 装订（证书无 OCSP URL 时 stapling 静默跳过）

server {
    listen 80;
    listen [::]:80;
    server_name amazingbank.ai www.amazingbank.ai _;

    # ACME http-01 预留（未来切换 Let's Encrypt 自动续期时启用）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name amazingbank.ai www.amazingbank.ai;

    ssl_certificate         /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_stapling            on;
    ssl_stapling_verify     on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- 发版缓存策略（2026-10-27 对齐 asdm-ai-2026 deploy/nginx）----
    # /assets/ 为 Vite 内容哈希产物——单头强缓存一年（expires 与 add_header 并存
    # 会产生双重 Cache-Control 响应头，统一为一条）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # location 内含 add_header 时不再继承 server 级安全头——按序显式补齐
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html 是唯一引用哈希资源的入口——no-store 彻底禁止存储：
    # no-cache 仍允许磁盘缓存 + 启发式新鲜度，发版后老访客的旧 HTML 会由此
    # 存活数小时，浏览器按旧哈希名拉已删除的 assets——白屏或旧内容。
    # no-store 保证发版后任何刷新方式（回车/书签/F5）都回源拿新 HTML；
    # HTML 体积极小，放弃 304 的代价可忽略。
    # 根路径（index 指令）与语言前缀路径 /zh-cn/、/en-us/（try_files 回退）
    # 均经内部重定向重新匹配到本 location，同样获得 no-store。
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 根级元文件随发版可能变更——no-cache 保留 304 协商校验
    location = /favicon.svg {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback：语言前缀路径与未知路径回落 index.html（前端语言路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
