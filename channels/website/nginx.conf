# ABNK Website — 容器内 nginx 配置
#
# - :80 全量 301 跳转 https（$host 保留原域名）
# - :443 TLS 终止（证书只读挂载 /etc/nginx/ssl——部署根数据域，续期只需 restart）
# - 静态托管 + SPA fallback（try_files → /index.html）
# - TLS 安全基线：TLS1.2/1.3 + 主流套件 + HSTS + OCSP 装订（证书无 OCSP URL 时 stapling 静默跳过）

server {
    listen 80;
    listen [::]:80;
    server_name amazingbank.ai www.amazingbank.ai _;

    # ACME http-01 预留（未来切换 Let's Encrypt 自动续期时启用）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name amazingbank.ai www.amazingbank.ai;

    ssl_certificate         /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_stapling            on;
    ssl_stapling_verify     on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root  /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（Vite 产物带内容哈希——可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback：未知路径回落 index.html（前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
