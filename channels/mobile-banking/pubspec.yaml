name: abnk_mobile
description: "ABNK 手机银行（Amazing Bank mobile banking）——Sprint v0.0.1 Part02 Phase P1 mock 原型。三目标载体（web + iOS + Android，ADR-009）。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, followed by an optional
# build number separated by a plus sign.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
version: 1.0.1+2

environment:
  sdk: ^3.13.7

# Dependencies specify what packages your package needs to work.
#
# To automatically upgrade your package dependencies to the latest available versions,
# run `flutter pub upgrade --major-versions`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # ABNK 设计系统字体栈（P1.2 主题依赖）——字体文件自托管于 assets/fonts/
  # （对齐官网 no-CDN 口径），google_fonts 仅做族名匹配，运行时拉取已禁用。
  google_fonts: ^6.3.1

  # ABNK 生成 client（P2.6 契约生成物，P3.1 接线的 remote 数据层载体）——
  # 包名 openapi，路径依赖同仓 openapi-generated/，随契约冻结版锁定。
  # dio 为 remote 适配层直接消费（DioException 捕获与错误映射），显式声明。
  dio: ^5.7.0

  # 官方 l10n 框架（Part03 P3）——提供 MaterialLocalizations 等 delegates，
  # 使 Material 内建组件文案随 locale 切换；配合 generate: true 驱动 gen-l10n。
  # Official l10n framework (Part03 P3): provides delegates such as
  # MaterialLocalizations so built-in Material texts follow the locale,
  # and pairs with generate: true to drive gen-l10n codegen.
  flutter_localizations:
    sdk: flutter

  # intl 用 any 让 pub 按 SDK 配套解析版本（手动钉版会与 SDK 内置版本冲突），
  # gen-l10n 的 placeholder 插值依赖此包。
  # intl stays `any` so pub resolves the SDK-matched version (pinning conflicts
  # with the bundled one); gen-l10n placeholder interpolation depends on it.
  intl: any

  # locale 持久化（Part03 P3.2）——存储用户语言偏好（key=abnk.locale），
  # web 载体落到 localStorage，移动载体落到平台 KV 存储。
  # Locale persistence (Part03 P3.2): stores the user's language preference
  # (key=abnk.locale) — backed by localStorage on web and platform KV stores
  # on the mobile targets.
  shared_preferences: ^2.3.0
  openapi:
    path: openapi-generated

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 三载体走查（P1.3 VP1.3.5/VP1.3.6）——flutter drive 驱动 UI 并截屏归档
  integration_test:
    sdk: flutter

  # 启动器图标生成（iOS AppIcon + Android mipmap/自适应图标）——
  # 源图 assets/brand/app-icon-1024.png（ASDM logo，SVG 矢量栅格化）
  flutter_launcher_icons: ^0.14.4

  # The "flutter_lints" package above contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # 开启 l10n 代码生成（Part03 P3）——构建时自动运行 gen-l10n，
  # 生成物位于 .dart_tool/flutter_gen/（合成包，不入 git）。
  # Enables l10n codegen (Part03 P3): builds invoke gen-l10n automatically;
  # outputs live in .dart_tool/flutter_gen/ (synthetic package, not in git).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ABNK mock fixtures（P0.3 种子快照导出，mock repository 数据源）
  # 双语数据集：zh-cn / en-us 两套目录，目录级声明递归包含全部 JSON；
  # 数据集由 --dart-define=ABNK_DATA_LOCALE 编译期选择（Phase 4 任务 4.2 接线）。
  # EN: ABNK mock fixtures (P0.3 seed snapshot export, the mock repository data
  # source); bilingual data sets under zh-cn/ and en-us/, declared at the
  # directory level; the active set is selected at compile time via
  # --dart-define=ABNK_DATA_LOCALE (wired up in Phase 4 task 4.2).
  assets:
    - fixtures/zh-cn/
    - fixtures/en-us/
    # 自托管字体资产目录——google_fonts 在 allowRuntimeFetching=false 时按
    # 「族名去空格-变体名.ttf」文件名约定经 AssetManifest 命中（实测源码口径）。
    - assets/fonts/
    # ASDM 品牌 logo（登录页展示；SVG 矢量 1024 栅格化，透明底）
    - assets/brand/asdm-logo.png

  # ABNK 自托管字体（no-CDN 口径）——fonts 段注册直连族名（供
  # fontFamilyFallback 与非 google_fonts 路径使用），文件与 assets 段共用。
  fonts:
    - family: Oxanium
      fonts:
        - asset: assets/fonts/Oxanium-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oxanium-Medium.ttf
          weight: 500
        - asset: assets/fonts/Oxanium-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Oxanium-Bold.ttf
          weight: 700
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifSC-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
