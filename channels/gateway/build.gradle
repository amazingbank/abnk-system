plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ai.amazingbank'
version = '0.0.1-SNAPSHOT'
description = 'ABNK API Gateway (Spring Cloud Gateway, Phase P2.1)'

java {
    toolchain {
        // 与 fineract 仓同口径：JDK 25 toolchain（硬门槛）
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    // 版本组合钉死（均为 Boot 3.5 兼容线）：
    // - Spring Boot 3.5.x（LTS）——不对齐 fineract 仓的 Boot 4.1.1（独立服务口径）
    // - Spring Cloud 2025.0.x
    // - springdoc 2.8.x（Boot 4 需 springdoc v3 线，升 Boot 4 时须同步换）
    set('springCloudVersion', '2025.0.0')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // SCG 2025.0.x starter（WebFlux 服务端网关，4.3+ 新命名）
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    // springdoc 必须用 WebFlux 线（SCG 是 WebFlux 栈；误用 webmvc starter 不生效）
    // P2.6 /v3/api-docs 契约导出依赖此依赖
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.9'
    // P2.2（D2 简化登录）：starter-security 随放行清单（SecurityConfig permitAll）一并引入——
    // 通道鉴权由 BearerTokenFilter（GlobalFilter）执行，Security 只占框架位（换 Keycloak 时替换点在 SecurityConfig）
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Nimbus JOSE JWT（经 spring-security-oauth2-jose 引入，版本随 Boot BOM）——HS256 签发/解析
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    // P2.4 转账幂等缓存（externalId → 首次响应，TTL 24h；版本随 Boot BOM）
    implementation 'com.github.ben-manes.caffeine:caffeine'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    // JUnit 5（spring-boot-starter-test 传递）；无此声明则 Gradle 默认 JUnit4 跑不到用例
    useJUnitPlatform()
}
