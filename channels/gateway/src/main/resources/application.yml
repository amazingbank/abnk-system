server:
  port: 8080

spring:
  application:
    name: abnk-gateway
  cloud:
    gateway:
      server:
        webflux:
          # 转发目标（Fineract 生产形态）：
          # dev 形态 = 本地生产形态栈；服务器形态经 ABNK_FINERACT_BASE 指向容器内网（如 http://abnk-fineract:8080）
          # ⚠️ SCG 实测（2026-11-07）忽略 route URI 的 path 部分——context path 必须
          # 经 PrefixPath 显式拼回，故 base 与前缀拆为两个 env 变量
          # P2.3 起 customer-channel 路由移除：对客面（/abnk/api/v1/*）收敛为网关本地
          # @RestController 聚合（customer/ 包），数据源走 FineractClient；仅 bo 通道保留转发
          routes:
            # bo 通道放行矩阵（P2.5，BoRouteFilter 执行，order -80）：
            #   channel=internal → jobs ✅ / configurations ✅ / fineract.json ❌(404) / 其余 ✅
            #                        （含贷款 command 族与 identifiers PUT——旅程 Step 7 修复端点）
            #   channel=customer → /bo/api/** 全部 ❌(403)——通道隔离核心断言
            - id: bo-channel
              uri: ${ABNK_FINERACT_BASE:http://localhost:8081}
              predicates:
                - Path=/bo/api/**
              filters:
                - StripPrefix=1                                                        # /bo/api/v1/clients -> /api/v1/clients
                - PrefixPath=${ABNK_FINERACT_PREFIX:/fineract-provider}                 # -> /fineract-provider/api/v1/clients
          # Fineract 租户头/Basic 双头由网关全局注入（权威来源在网关侧，
          # 客户端传入的同名头先剥后加，避免重复/伪造）
          default-filters:
            - RemoveRequestHeader=Fineract-Platform-TenantId
            - AddRequestHeader=Fineract-Platform-TenantId, default
            - RemoveRequestHeader=Authorization
            - AddRequestHeader=Authorization, Basic bWlmb3M6cGFzc3dvcmQ=

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---- P2.2 简化登录与 JWT（D2 口径）----
abnk:
  # 对客聚合的 Fineract 数据源（P2.3；与 SCG bo 路由同 base/prefix 口径，双头在 FineractClient 注入）
  fineract:
    base: ${ABNK_FINERACT_BASE:http://localhost:8081}
    prefix: ${ABNK_FINERACT_PREFIX:/fineract-provider}
  users:
    # 网关用户表（P0.3 产物）。dev/bootRun 默认相对网关工程工作目录（$GW/../../data）；
    # 容器形态（P3.4）经 ABNK_USERS_FILE 指向 /app/data/gateway_users.json
    file: ${ABNK_USERS_FILE:../../data/gateway_users.json}
  jwt:
    # HS256 密钥：开发默认值入 public 仓（占位）；生产值经 env 注入（真实值只存 .github-private）
    secret: ${ABNK_JWT_SECRET:abnk-dev-jwt-secret-0123456789abcdef-0123456789abcdef}
    # 短时效 token（ISO-8601 duration）
    ttl: PT15M
  security:
    # BearerTokenFilter 放行清单（Ant 风格，逗号分隔——@Value 占位符与 YAML 列表形式不兼容）
    # 受保护路径 = 其余全部（含 /abnk/api/**、/bo/api/**）
    public-paths: ${ABNK_PUBLIC_PATHS:/login,/actuator/health}
