# ABNK 生产编排 — abnk-prod compose 栈（全栈七容器，P3.4 扩容）
#
# 生产环境 = 正式部署实例（abnk-vm001）。拓扑：**abnk-nginx 单入口**（唯一绑定
# 宿主 80/443，TLS 终止 + 按 Host 分流，见 nginx-gateway.conf）+ 六后端容器
# （website 官网 / gateway SCG 网关 / fineract 平台 / pg-platform 数据库 /
# bo 运营后台 / mweb 手机银行 web）。
#
# ⚠️ 取代关系（P3.5 切换口径）：本文件的服务定义已并入并 **supersede**
#    `compose-abnk-platform.yaml`（平台栈：abnk-pg-platform + abnk-fineract——
#    服务/容器/卷名同构，固定卷名 abnk-pg-platform-data 数据不动；P3.5.6 先退役
#    平台栈再 up 本栈，同名容器不退役则 up 必失败）。
#
# ⚠️ 铁律（对齐 AOS Iron Rule 21 与 abnk-prod-deploy，不可协商）：
#   - 宿主挂载一律经 ${ABNK_DEPLOY_ROOT:?}（部署根缺失即 compose 硬失败，不静默回落）
#   - up/down 必须带 --env-file（服务器 ~/deploy/.env；本地演练用
#     deploy/prod/env/abnk-fullstack.drill.env）
#   - 一切运行时写入物（TLS 证书/日志/备份）归部署根，代码域随仓库
#   - 五自建镜像 tag 必须显式注入（:? 硬失败闸，无缺省回退）；
#     pg 与 nginx 入口为钉版本基础镜像，无 tag 变量
#
# 用法一（服务器——所有制品在服务端构建，P3.5）：
#   cd ~/source/abnk-system
#   docker compose --env-file ~/deploy/.env -f deploy/prod/compose-abnk-prod.yaml up -d
#
# 用法二（本地 prod 演练，VP3.4.2——多带 drill override 回环 8081）：
#   cd $ABNK_REPO/deploy/prod
#   docker compose -f compose-abnk-prod.yaml -f docker-compose.drill-override.yml \
#     --env-file env/abnk-fullstack.drill.env up -d

# ⚠️ 必须显式固定项目名——避免与本地开发 compose（deploy/compose，name: abnk-system）
# 冲突，也避免与 AOS 等其他项目 compose 撞项目名。
name: abnk-prod

services:
  # ── 单入口：TLS 终止 + Host 分流（唯一绑定宿主 80/443） ──────────────────
  abnk-nginx:
    container_name: abnk-nginx
    # 钉版本基础镜像（与 abnk-website 运行层同源——证书续期范式统一在 nginx 家族）
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # conf 属代码域，随仓库只读挂载（compose 相对路径 = 本文件所在目录）
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS 证书（部署根数据域，只读——续期 = 覆盖两 PEM + restart abnk-nginx，
      # 铁律 6 拓扑适配：续期 restart 目标从 abnk-website 迁至本容器）
      - ${ABNK_DEPLOY_ROOT:?AOS-style deploy root is required}/nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      # 兜底 default_server → 网关根，/actuator/health 在网关放行清单（P2.2）；
      # 勿用业务路径（需 Bearer）。自签/通配证书均免校验探活
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      abnk-gateway:
        condition: service_started

  # ── 官网（原单容器栈沿用；80/443 宿主映射收编给入口，TLS 由入口终止） ──────
  abnk-website:
    container_name: abnk-website
    # 镜像 tag 由发版流程注入（每次 up 必须显式给 ABNK_WEBSITE_IMAGE——无缺省回退）
    image: ${ABNK_WEBSITE_IMAGE:?ABNK_WEBSITE_IMAGE is required}
    restart: unless-stopped
    # 端口收编（P3.4）：不再绑定宿主 80/443——apex/www Host 由 abnk-nginx 反代至
    # 容器内 80；镜像 tag 与内部配置不变
    volumes:
      # 容器内 nginx.conf 的 :443 server 块仍引用证书文件（缺失则容器起不来），
      # 挂载保留以满足加载与既有 healthcheck——纯容器内部拓扑，不对公网暴露
      - ${ABNK_DEPLOY_ROOT:?AOS-style deploy root is required}/nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── SCG 网关（对客收敛面 + bo 转发 + 简化登录/JWT） ──────────────────────
  abnk-gateway:
    container_name: abnk-gateway
    image: ${ABNK_GATEWAY_IMAGE:?ABNK_GATEWAY_IMAGE is required}
    restart: unless-stopped
    environment:
      # Fineract 容器内网基址（prefix /fineract-provider 取 application.yml 缺省；
      # SCG bo 路由与 FineractClient 同源——base/prefix 拆分口径见 application.yml）
      ABNK_FINERACT_BASE: ${ABNK_FINERACT_BASE:-http://abnk-fineract:8080}
      # 用户表镜像内默认（Dockerfile ENV；仅 dev 形态 bootRun 覆盖为宿主路径）
      ABNK_USERS_FILE: ${ABNK_USERS_FILE:-/app/data/gateway_users.json}
      # HS256 密钥：生产值经部署根 .env 注入（源 .github-private 凭据档案）；
      # 本地演练用 public 仓开发占位值（abnk-fullstack.drill.env）
      ABNK_JWT_SECRET: ${ABNK_JWT_SECRET:?ABNK_JWT_SECRET is required}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:+UseContainerSupport
    healthcheck:
      # 网关根 actuator（放行清单，P2.2）——镜像运行层已装 curl
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      abnk-fineract:
        condition: service_started

  # ── Fineract 平台（WAR + Tomcat；定义沿 P0.4 平台栈口径，被本栈 supersede） ──
  abnk-fineract:
    container_name: abnk-fineract
    image: ${ABNK_FINERACT_IMAGE:?ABNK_FINERACT_IMAGE is required}
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    # 平台栈 8080 公网直暴（D7）随本栈收编：公网入口统一走 abnk-nginx → 网关；
    # 宿主端口仅经 drill override 回环 8081（本地演练种子/核对通道）
    environment:
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://abnk-pg-platform:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: ${ABNK_PG_USER:?ABNK_PG_USER required}
      FINERACT_HIKARI_PASSWORD: ${ABNK_PG_PASSWORD:?ABNK_PG_PASSWORD required}
      # ⚠️ HOSTNAME 必须显式注入（默认 localhost 在容器内不可达 PG——P0.1 实测坑）
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: abnk-pg-platform
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: ${ABNK_PG_USER:?ABNK_PG_USER required}
      FINERACT_DEFAULT_TENANTDB_PWD: ${ABNK_PG_PASSWORD:?ABNK_PG_PASSWORD required}
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      # Tomcat 平面 HTTP（TLS 终止在入口 abnk-nginx）
      FINERACT_SERVER_SSL_ENABLED: "false"
      # JVM：对照平台栈实测口径（服务器 7.7G 内存，2G 堆 + 官方 --add-opens 系列）
      JAVA_TOOL_OPTIONS: >-
        -Xmx2G -XX:+UseContainerSupport
        --add-exports=java.naming/com.sun.jndi.ldap=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.security=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.management/javax.management=ALL-UNNAMED
        --add-opens=java.naming/javax.naming=ALL-UNNAMED
    healthcheck:
      # 镜像运行层已装 curl（Dockerfile.fineract P3.4 追加）；Tomcat 部署 +
      # Liquibase 新库首迁 15-30 min——start_period 与 retries 覆盖首迁窗口
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/fineract-provider/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 20m
    depends_on:
      abnk-pg-platform:
        condition: service_healthy

  # ── 平台数据库（定义沿 P0.4 平台栈；固定卷名 = 平台栈数据连续） ───────────
  abnk-pg-platform:
    container_name: abnk-pg-platform
    image: postgres:18.3
    restart: unless-stopped
    # 不映射宿主端口——仅 compose 内网（PG 永不对公网）
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${ABNK_PG_USER:?ABNK_PG_USER required}
      POSTGRES_PASSWORD: ${ABNK_PG_PASSWORD:?ABNK_PG_PASSWORD required}
      POSTGRES_DB: root
      TZ: ${ABNK_TZ:-Asia/Shanghai}
    # Fineract 迁移代码不建库（TenantDatabaseUpgradeService 无 CREATE DATABASE），
    # 必须由 initdb 通道预建 fineract_tenants + fineract_default 两库（P0.1 实测；
    # 脚本自仓内 deploy/compose/initdb/ 复制到部署根——本地演练根同理）。
    volumes:
      # ⚠️ PostgreSQL 18+：挂 /var/lib/postgresql 父目录（版本化子目录 18/data）
      - abnk-pg-platform-data:/var/lib/postgresql
      - ${ABNK_DEPLOY_ROOT:?ABNK_DEPLOY_ROOT required}/initdb/01-init-abnk.sh:/docker-entrypoint-initdb.d/01-init-abnk.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ABNK_PG_USER}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ── Backoffice（运营后台静态站） ────────────────────────────────────────
  abnk-bo:
    container_name: abnk-bo
    image: ${ABNK_BO_IMAGE:?ABNK_BO_IMAGE is required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── 手机银行 web 载体（静态站） ─────────────────────────────────────────
  abnk-mweb:
    container_name: abnk-mweb
    image: ${ABNK_MWEB_IMAGE:?ABNK_MWEB_IMAGE is required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  abnk-pg-platform-data:
    # name 固定 = 平台栈同款（P3.5 切换时服务器既有数据卷直接延续——数据不动、
    # 种子连续，无需重施加）；避免 compose 加 abnk-prod_ 前缀
    name: abnk-pg-platform-data
