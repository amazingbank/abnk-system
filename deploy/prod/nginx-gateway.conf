# ---- dev.amazingbank.ai → Dev Portal（ASDM 过程资产门户；静态直供） ----
# ---- dev.amazingbank.ai → Dev Portal (ASDM process-asset portal; static) ----
# Part04 Phase 4 新增（api/app/bo 模式第四次适用）：Dev Portal 为纯渲染器
# （ADR-010 D7——只读消费 abnk-asdm 仓结构化资产），容器内 :80 平面 HTTP
# 直供（SPA fallback/缓存头/gzip 见 portal 仓 nginx.conf），TLS 与安全头
# 由本入口统一终止/注入（证书 = *.amazingbank.ai 通配符，dev 子域零新增）。
# Added in Part04 Phase 4 (fourth reuse of the api/app/bo pattern): the Dev
# Portal is a pure renderer (ADR-010 D7 — read-only consumer of the abnk-asdm
# repo's structured assets) serving plain HTTP on :80 in-container (SPA
# fallback/cache headers/gzip live in the portal repo's nginx.conf); TLS and
# security headers terminate/inject here at the entry (the *.amazingbank.ai
# wildcard covers the dev subdomain at zero extra cost).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.amazingbank.ai;

    ssl_certificate         /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://abnk-devportal:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

