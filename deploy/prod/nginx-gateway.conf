# ABNK 全栈入口（abnk-nginx）—— TLS 终止 + 按 Host 分流的单入口拓扑
#
# 定位（P3.4）：全栈唯一绑定宿主 80/443 的 service。abnk-gateway 是 SCG
# Java/Netty 容器，不能消费 nginx conf 与 PEM 证书——公网 TLS 终止与证书续期
# 范式（覆盖两 PEM + restart，abnk-prod-deploy 铁律 6）只能落在本容器；
# abnk-website 原自终止 TLS 的 :443 收编为此处反代（容器内 80）。
#
# 单一 conf 双场景（随部署根内容切换，conf 不分版本——避免双 conf 漂移）：
#   - 生产（abnk-vm001）：证书挂载点 /etc/nginx/ssl = *.amazingbank.ai 通配符对
#   - 本地演练（VP3.4.2）：/etc/nginx/ssl = 演练根自签对（SAN localhost + 通配域）
#
# 分流矩阵（Host → upstream，全部 compose 内网容器名）：
#   api.amazingbank.ai            → abnk-gateway:8080（SCG 网关）
#   app.amazingbank.ai            → abnk-mweb:80（手机银行 web）
#   bo.amazingbank.ai             → abnk-bo:80（Backoffice）
#   dev.amazingbank.ai            → abnk-devportal:80（Dev Portal——Part04
#                                   Phase 4 新增，过程资产门户静态直供）
#   amazingbank.ai / www          → abnk-website:80（官网）
#   default_server（兜底）        → abnk-gateway:8080
#     ——生产请求均带真实 Host 不会命中兜底；本地演练 https://localhost 命中兜底
#     直达网关（VP3.4.4 双剧本基址即 https://localhost，Client 已跳过证书校验）。

# ---- :80 → 301 https（全 Host，保留原域名） ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- api.amazingbank.ai → 网关（SCG） ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.amazingbank.ai;

    ssl_certificate         /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_stapling            on;
    ssl_stapling_verify     on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /actuator/health 在网关放行清单（P2.2）——入口健康探活即此路径
    location / {
        proxy_pass http://abnk-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

